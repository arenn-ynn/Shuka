# Demo-only Render Free deployment. All database and uploaded-image changes are temporary.
services:
  - type: web
    name: shuka-marketplace
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/categories
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/shuka-data
      - key: COOKIE_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
      - key: NODE_VERSION
        value: 22.16.0
# NO disk: Render Free doesn't support persistent disks.
